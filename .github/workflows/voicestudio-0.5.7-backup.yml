name: Backup VoiceStudio 0.5.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voicestudio-0.5.7-backup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voicestudio-0.5.7-backup
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "debpalash/VoiceStudio"
  UPSTREAM_COMMIT: "d819ff54d93017bf4a5b34b605833162163c9e3c"
  VERSION: "0.5.7"
  BACKUP_DATE: "20261019"
  RELEASE_TAG: "voicestudio-0.5.7-backup-20261019"

jobs:
  windows-backup:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Create or reuse backup Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null)) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --draft --title "VoiceStudio 0.5.7 backup (2026-10-19)" --notes "Pinned source/build backup of upstream VoiceStudio 0.5.7. Model weights are intentionally not redistributed."
            if ($LASTEXITCODE -ne 0) { throw "Unable to create draft Release" }
          }

      - name: Clone exact upstream source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          git clone https://github.com/$env:UPSTREAM_REPO.git (Join-Path $root "source")
          if ($LASTEXITCODE -ne 0) { throw "Upstream clone failed" }
          Push-Location (Join-Path $root "source")
          git checkout --detach $env:UPSTREAM_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Pinned checkout failed" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:UPSTREAM_COMMIT) { throw "Pinned commit mismatch: $actual" }
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne $env:VERSION) { throw "Unexpected package version: $version" }
          Pop-Location

      - name: Preserve Git history and submodule
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup"
          $source = Join-Path $root "source"
          $out = Join-Path $root "out"
          New-Item -ItemType Directory -Force $out | Out-Null

          Push-Location $source
          git bundle create (Join-Path $out "VoiceStudio-0.5.7-upstream.bundle") --all
          if ($LASTEXITCODE -ne 0) { throw "Main Git bundle failed" }

          $gitlink = (git ls-tree HEAD omnivoice-gallery).Trim()
          if (-not $gitlink) { throw "omnivoice-gallery gitlink missing" }
          $subSha = ($gitlink -split "\s+")[2]
          $subUrl = (git config -f .gitmodules --get submodule.omnivoice-gallery.url).Trim()
          Pop-Location

          $mirror = Join-Path $root "omnivoice-gallery.git"
          git clone --mirror $subUrl $mirror
          if ($LASTEXITCODE -ne 0) { throw "Submodule mirror failed" }
          git -C $mirror cat-file -e "$subSha^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Pinned submodule commit missing" }
          git -C $mirror bundle create (Join-Path $out "omnivoice-gallery.bundle") --all
          if ($LASTEXITCODE -ne 0) { throw "Submodule bundle failed" }

          @{
            path = "omnivoice-gallery"
            url = $subUrl
            commit = $subSha
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out "SUBMODULE.json")

      - name: Create clean source archive
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup"
          $source = Join-Path $root "source"
          $out = Join-Path $root "out"
          $stage = Join-Path $root "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Push-Location $source
          git archive --format=tar --prefix=VoiceStudio-0.5.7/ HEAD -o (Join-Path $stage "source.tar")
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }
          Pop-Location
          tar.exe -czf (Join-Path $out "VoiceStudio-0.5.7-source.tar.gz") -C $stage "source.tar"
          if ($LASTEXITCODE -ne 0) { throw "source compression failed" }

      - name: Bundle pinned uv into Electron build
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\source"
          $uv = (Get-Command uv.exe).Source
          $dest = Join-Path $source "electron\build\uv"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $uv (Join-Path $dest "uv-x86_64-pc-windows-msvc.exe")

      - name: Install locked Bun dependencies
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\source")
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "bun install failed" }

      - name: Validate Electron source
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\source")
          bun run check:electron
          if ($LASTEXITCODE -ne 0) { throw "Electron validation failed" }

      - name: Build Windows x64 package
        shell: pwsh
        env:
          VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
          VOICESTUDIO_UPDATE_CHANNEL: electron-stable-win32-x64
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\source\electron")
          bun x electron-builder --config electron-builder.config.mjs --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
          node tests/packaging-contract.mjs --artifact
          if ($LASTEXITCODE -ne 0) { throw "Packaging contract failed" }
          node tests/update-package-contract.mjs --platform win32 --arch x64
          if ($LASTEXITCODE -ne 0) { throw "Update package contract failed" }
          node ../scripts/create_store_artifact_manifest.mjs --platform=win32 --arch=x64
          if ($LASTEXITCODE -ne 0) { throw "Store artifact manifest failed" }

      - name: Packaged startup smoke test
        shell: pwsh
        env:
          VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
          VOICESTUDIO_UPDATE_CHANNEL: electron-stable-win32-x64
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\source\electron")
          node tests/packaged-smoke.mjs --setup
          if ($LASTEXITCODE -ne 0) { throw "Packaged startup smoke failed" }

      - name: Preserve Bun cache for source rebuild
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup"
          $out = Join-Path $root "out"
          $cache = Join-Path $env:USERPROFILE ".bun\install\cache"
          if (Test-Path $cache) {
            tar.exe -czf (Join-Path $out "VoiceStudio-0.5.7-bun-cache-win-x64.tar.gz") -C (Split-Path $cache -Parent) (Split-Path $cache -Leaf)
            if ($LASTEXITCODE -ne 0) { throw "Bun cache archive failed" }
          } else {
            throw "Bun cache not found"
          }

      - name: Copy installer and metadata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup"
          $source = Join-Path $root "source"
          $out = Join-Path $root "out"
          $release = Join-Path $source "electron\release"
          Get-ChildItem $release -File | Where-Object {
            $_.Name -like "VoiceStudio-Electron-*" -or
            $_.Name -like "electron-*.yml" -or
            $_.Name -like "store-artifact-manifest-*.json"
          } | Copy-Item -Destination $out

          Copy-Item (Join-Path $source "uv.lock"),(Join-Path $source "bun.lock"),(Join-Path $source "native\desktop-bridge\Cargo.lock"),(Join-Path $source "pyproject.toml"),(Join-Path $source "package.json") -Destination $out

      - name: Write verification and scope report
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup"
          $out = Join-Path $root "out"
          $source = Join-Path $root "source"
          $sub = Get-Content (Join-Path $out "SUBMODULE.json") -Raw | ConvertFrom-Json
          $installer = Get-ChildItem $out -File | Where-Object { $_.Name -like "VoiceStudio-Electron-*.exe" } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer missing" }

          $report = [ordered]@{
            schemaVersion = 1
            date = "2026-10-19"
            version = $env:VERSION
            upstreamRepository = $env:UPSTREAM_REPO
            upstreamCommit = $env:UPSTREAM_COMMIT
            packageManager = "bun 1.4.2"
            node = "22"
            uv = "0.12.13"
            rustTarget = "x86_64-pc-windows-msvc"
            submodule = $sub
            checks = [ordered]@{
              bunFrozenInstall = "passed"
              electronCheck = "passed"
              windowsX64Package = "passed"
              packagingContract = "passed"
              updaterContract = "passed"
              packagedStartupSmokeSetup = "passed"
            }
            installer = [ordered]@{
              name = $installer.Name
              bytes = $installer.Length
              sha256 = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
              signing = "unsigned backup build; not an upstream signed release"
            }
            scope = [ordered]@{
              included = @(
                "complete upstream Git history as bundle",
                "clean pinned source archive",
                "omnivoice-gallery Git history bundle at pinned gitlink",
                "Windows x64 Electron installer built from pinned source",
                "Bun dependency cache used by this build",
                "uv.lock, bun.lock, Cargo.lock and project manifests"
              )
              notIncluded = @(
                "TTS/ASR model weights and Hugging Face model repositories",
                "complete Python wheel/runtime cache",
                "CUDA/cuDNN runtimes",
                "paid provider credentials or API keys",
                "macOS/Linux installers",
                "upstream code-signing certificates"
              )
              note = "Model and Python runtime dependencies are intentionally separate because of size, platform variants and third-party licensing. This backup preserves enough source/build identity to reconstruct them from their locked manifests when upstream package sources remain available."
            }
          }
          $report | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $out "BACKUP_VERIFICATION.json")

          @(
            "# VoiceStudio 0.5.7 backup",
            "",
            "Pinned upstream: debpalash/VoiceStudio",
            "Commit: $env:UPSTREAM_COMMIT",
            "Version: $env:VERSION",
            "",
            "This snapshot preserves the full Git history, a clean pinned source archive, the omnivoice-gallery submodule history, the Bun cache used for the Windows build, exact dependency lockfiles, and a Windows x64 Electron installer built and smoke-tested from the pinned source.",
            "",
            "The installer is an unsigned backup build, not an official signed upstream release.",
            "",
            "Model weights and the complete Python/CUDA runtime are intentionally not redistributed. VoiceStudio's model inventory has separate licences and some downloads require Hugging Face access or explicit acceptance. See BACKUP_VERIFICATION.json for exact scope."
          ) | Set-Content -Encoding utf8 (Join-Path $out "README-BACKUP.md")

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\out"
          $lines = Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $out "SHA256SUMS.txt")

      - name: Upload all backup assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\out"
          Get-ChildItem $out -File | ForEach-Object {
            if ($_.Length -ge 2100000000) { throw "Asset exceeds GitHub release limit: $($_.Name)" }
            gh release upload "$env:RELEASE_TAG" $_.FullName --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($_.Name)" }
          }

      - name: Round-trip small integrity metadata and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $check = Join-Path $env:RUNNER_TEMP "VoiceStudioBackup\roundtrip"
          New-Item -ItemType Directory -Force $check | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "BACKUP_VERIFICATION.json" --pattern "SHA256SUMS.txt" --dir $check
          if ($LASTEXITCODE -ne 0) { throw "Round-trip metadata download failed" }
          if (-not (Test-Path (Join-Path $check "BACKUP_VERIFICATION.json"))) { throw "Verification metadata missing after round trip" }
          if (-not (Test-Path (Join-Path $check "SHA256SUMS.txt"))) { throw "Checksum manifest missing after round trip" }
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --notes "VoiceStudio 0.5.7 pinned source/build backup. Includes full Git history, submodule bundle, exact lockfiles, Bun cache and a smoke-tested unsigned Windows x64 Electron build. Model weights and full Python/CUDA runtime are intentionally excluded; see BACKUP_VERIFICATION.json."
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed" }
